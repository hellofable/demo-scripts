name: Sync Demo Scripts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo-scripts repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FABLE_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Sync from individual screenplay repos
        env:
          GH_TOKEN: ${{ secrets.FABLE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          touch .nojekyll

          jq -e . catalog.json >/dev/null
          mapfile -t REPOS < <(jq -r 'to_entries | map(select(.value.disabled != true)) | .[].key' catalog.json)
          echo "Repos from catalog.json: ${REPOS[*]:-<none>}"
          if [ ${#REPOS[@]} -eq 0 ]; then
            echo "No repos listed in catalog.json"; exit 1
          fi

          shopt -s nullglob
          for marker in */.synced-by-workflow; do
            dir="${marker%/.synced-by-workflow}"
            dir="${dir#./}"
            case " ${REPOS[*]} " in
              *" ${dir} "*) ;;
              *) echo "🧹 Removing ${dir} (not in catalog)"; rm -rf -- "${dir}";;
            esac
          done

          for repo in "${REPOS[@]}"; do
            echo "Syncing ${repo}..."
            git clone "https://github.com/hellofable/${repo}" "/tmp/${repo}" --depth 1 --quiet

            mkdir -p -- "${repo}"

            if [ -f "/tmp/${repo}/screenplay.bundle" ]; then
              cp "/tmp/${repo}/screenplay.bundle" "${repo}/"
            else
              echo "❌ ${repo} missing screenplay.bundle"; exit 1
            fi

            if [ -f "/tmp/${repo}/screenplay.fountain" ]; then
              cp "/tmp/${repo}/screenplay.fountain" "${repo}/"
            else
              echo "❌ ${repo} missing screenplay.fountain"; exit 1
            fi

            touch "${repo}/.synced-by-workflow"
            ls -al "${repo}"
            rm -rf -- "/tmp/${repo}"
            echo "  ✅ Synced ${repo}"
          done

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.FABLE_ACCESS_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git status --short
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sync from screenplay repos [$(date +'%Y-%m-%d %H:%M')]"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
